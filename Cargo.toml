[package]
name = "ocu"
version = "0.1.0"
description = "A usage monitor for OpenCode"
authors = ["Liam <liam@scalzulli.com>"]
license = "CC0-1.0"
homepage = "https://github.com/terror/ocu"
repository = "https://github.com/terror/ocu"
edition = "2024"
categories = ["command-line-utilities", "development-tools"]
keywords = ["opencode", "usage", "tokens", "cost", "terminal"]

[lints]
workspace = true

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
arbitrary-source-item-ordering = "deny"
pedantic = { level = "deny", priority = -1 }
wildcard_imports = "allow"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.4", features = ["derive"] }
crossterm = "0.29.0"
ratatui = "0.30.2"
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ureq = "3.3.0"

[dev-dependencies]
tempfile = "3.27.0"
